server:
  host: "0.0.0.0"
  port: 5000
  workers: 1
  root_path: "/ai/hub"
  silence_probes: true
  debug: false

postgres:
  uri: "postgresql://localhost:5432"
  database: "aihub"
  user: "aihub"
  pass: "vault:POSTGRES_PASSWORD"
  pool:
    size: 5
    max_overflow: 10
    timeout: 30
    recycle: 1800
